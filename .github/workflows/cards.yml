name: Refresh Profile Cards

on:
  # Perbarui statistik setiap hari pukul 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Ikut jalan saat aset atau generator berubah
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Aset animasi murni deterministik, jadi cukup di-generate ulang
      - name: Generate Animated Assets
        run: python3 tools/gen_svg.py

      # Kartu statistik ditarik lewat GraphQL pakai token bawaan Actions
      - name: Generate Stats Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_cards.py ${{ github.repository_owner }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "update: refresh profile cards [skip ci]"
          git push origin master
