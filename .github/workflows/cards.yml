name: Refresh Profile Cards

on:
  # Perbarui statistik setiap hari pukul 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Ikut jalan saat generator berubah
  push:
    branches:
      - master
    paths:
      - "tools/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fontTools dipakai untuk subset font per SVG supaya ukuran aset kecil
      - name: Install Font Tooling
        run: pip install --quiet fonttools brotli

      # Statistik ditarik lewat GraphQL pakai token bawaan Actions, disimpan ke assets/stats.json
      - name: Fetch Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_cards.py ${{ github.repository_owner }}

      # Tile bento (termasuk tile statistik) dirender ulang dari stats.json terbaru
      - name: Generate Profile Tiles
        run: python3 tools/variants/bento.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "update: refresh profile cards [skip ci]"
          git push origin master
