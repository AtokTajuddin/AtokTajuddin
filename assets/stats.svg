<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" width="900" height="302" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Statistik GitHub AtokTajuddin">
