<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="ATOK TAJUDDIN - devsecops engineer  ::  pentest &amp; red team  ::  builder">
  <title>ATOK TAJUDDIN</title>
  <defs>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#0affff" opacity="0.05"/>
    </pattern>
    <clipPath id="sl0"><rect x="0" y="40" width="900" height="12"/></clipPath><clipPath id="sl1"><rect x="0" y="60" width="900" height="12"/></clipPath><clipPath id="sl2"><rect x="0" y="80" width="900" height="12"/></clipPath><clipPath id="sl3"><rect x="0" y="100" width="900" height="12"/></clipPath><clipPath id="sl4"><rect x="0" y="120" width="900" height="12"/></clipPath>
    <text id="nm" x="450" y="84" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="6">ATOK TAJUDDIN</text>
  </defs>
  <style>
    .chroma { animation: ch 4.6s steps(1) infinite; }
    .chroma2 { animation: ch2 4.6s steps(1) infinite; }
    .gl { opacity: 0; animation: sl 4.6s steps(1) infinite; }
    .base { animation: flick 4.6s steps(1) infinite; }
    @keyframes ch { 0%,86%,100% { transform: translate(0,0); opacity:.0 }
      87% { transform: translate(-5px,2px); opacity:.85 }
      90% { transform: translate(4px,-2px); opacity:.85 }
      93% { transform: translate(-2px,1px); opacity:.5 } }
    @keyframes ch2 { 0%,86%,100% { transform: translate(0,0); opacity:.0 }
      88% { transform: translate(5px,-2px); opacity:.8 }
      91% { transform: translate(-4px,2px); opacity:.8 }
      94% { transform: translate(2px,0); opacity:.45 } }
    @keyframes sl { 0%,85%,100% { opacity: 0 } 87%,92% { opacity: .95 } 93% { opacity: 0 } }
    @keyframes flick { 0%,88%,100% { opacity: 1 } 89% { opacity: .55 } 90% { opacity: 1 } 91% { opacity: .7 } }
    .cur { animation: bl 1.05s steps(1) infinite; }
    @keyframes bl { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
  </style>

  <rect width="900" height="170" rx="14" fill="#040805"/>
  <g filter="url(#g2)">
    <use href="#nm" class="chroma" fill="#22E7F7"/>
    <use href="#nm" class="chroma2" fill="#F7264F"/>
    <use href="#nm" class="base" fill="#16F74F"/>
  </g>
    <g clip-path="url(#sl0)" class="gl" style="animation-delay:2.51s"><use href="#nm" transform="translate(12,0)" fill="#16F74F"/></g>
    <g clip-path="url(#sl1)" class="gl" style="animation-delay:1.38s"><use href="#nm" transform="translate(12,0)" fill="#16F74F"/></g>
    <g clip-path="url(#sl2)" class="gl" style="animation-delay:1.02s"><use href="#nm" transform="translate(-10,0)" fill="#16F74F"/></g>
    <g clip-path="url(#sl3)" class="gl" style="animation-delay:2.27s"><use href="#nm" transform="translate(-22,0)" fill="#16F74F"/></g>
    <g clip-path="url(#sl4)" class="gl" style="animation-delay:0.57s"><use href="#nm" transform="translate(-16,0)" fill="#16F74F"/></g>
  <g opacity="0.75">
    <text x="450" y="124" text-anchor="middle" font-size="15" fill="#8CE6A5" letter-spacing="2">devsecops engineer  ::  pentest &amp; red team  ::  builder</text>
  </g>
  <g transform="translate(300,146)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#16F74F" stroke-opacity="0.3"/>
    <rect x="0" y="-2" width="70" height="4" fill="#16F74F">
      <animate attributeName="x" dur="3.4s" repeatCount="indefinite" values="0;230;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>
  </g>
  <rect width="900" height="170" rx="14" fill="url(#scan2)"/>
  <rect x="0.5" y="0.5" width="899" height="169" rx="14" fill="none" stroke="#16F74F" stroke-opacity="0.35"/>
</svg>
