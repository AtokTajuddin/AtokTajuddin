<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 22" width="900" height="22" role="img" aria-label="pembatas">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg"><feGaussianBlur stdDeviation="2.2" result="x"/>
      <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#dg)">
    <line x1="18" y1="11" x2="882" y2="11" stroke="url(#dl)" stroke-width="2"/>
    <path d="M 6 11 L 14 4 L 22 11 L 14 18 Z" fill="#22D3EE"/>
    <path d="M 878 11 L 886 4 L 894 11 L 886 18 Z" fill="#34D399"/>
  </g>
  <rect y="9.5" width="150" height="3" fill="url(#shine)" opacity="0.8">
    <animate attributeName="x" dur="4.5s" repeatCount="indefinite" values="-150;900"/>
  </rect>
  <circle cy="11" r="3.5" fill="#fff" opacity="0.9" filter="url(#dg)">
    <animate attributeName="cx" dur="4.5s" repeatCount="indefinite" values="18;882;18"
             keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
</svg>
