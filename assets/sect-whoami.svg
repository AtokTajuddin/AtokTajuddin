<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="whoami">
  <title>whoami</title>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="sg"><feGaussianBlur stdDeviation="1.6" result="x"/>
      <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .cr { animation: bl 1.05s steps(1) infinite; }
    @keyframes bl { 0%,55% { opacity:1 } 56%,100% { opacity:0 } }
  </style>
  <rect x="0" y="14" width="5" height="26" rx="2.5" fill="url(#bar)" filter="url(#sg)"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#16F74F" filter="url(#sg)">&gt; whoami</text>
  <rect x="114.4" y="19" width="10" height="16" fill="#16F74F" class="cr"/>
  <line x1="140.4" y1="27" x2="896" y2="27" stroke="url(#lg)" stroke-width="2"/>
  <circle cy="27" r="3" fill="#fff" opacity="0.85">
    <animate attributeName="cx" dur="5s" repeatCount="indefinite" values="140.4;886;140.4"
             keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0.9;0.9;0"/>
  </circle>
  <text x="896" y="20" text-anchor="end" font-size="11" fill="#0B7A2C">identity</text>
</svg>
