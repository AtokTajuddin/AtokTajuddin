    .kick { animation: kick 3.5s ease-in-out infinite; }
    @keyframes kick { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .ul { animation: ul 4s ease-in-out infinite; }
    @keyframes ul { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
  </style>

