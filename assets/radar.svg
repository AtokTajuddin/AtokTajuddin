<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Radar security: recon, web, binary, network, crypto, forensics">
  <title>security radar</title>
  <defs>
    <radialGradient id="sw">
      <stop offset="0" stop-color="#16F74F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#16F74F" stop-opacity="0"/>
    </radialGradient>
    <filter id="gr"><feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .blip { opacity: 0; animation: bp 4s linear infinite; }
    @keyframes bp { 0% { opacity: 1 } 45% { opacity: .25 } 100% { opacity: 0 } }
    .ping { animation: pg 4s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pg { 0% { r: 3.5; opacity: .9 } 30% { opacity: 0 } 100% { r: 16; opacity: 0 } }
  </style>
