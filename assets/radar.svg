  <line x1="18" y1="160" x2="302" y2="160" stroke="#16F74F" stroke-opacity="0.18"/><line x1="160" y1="18" x2="160" y2="302" stroke="#16F74F" stroke-opacity="0.18"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite" values="0 160 160;360 160 160"/>
    <path d="M 160 160 L 302 160 A 142 142 0 0 0 282.972 89 Z" fill="url(#sw)"/>
    <line x1="160" y1="160" x2="302" y2="160" stroke="#16F74F" stroke-opacity="0.8" filter="url(#gr)"/>
  </g>
  <g style="animation-delay:3.88s" class="blip"><circle cx="218.573" cy="148.767" r="3.5" fill="#16F74F"/><circle cx="218.573" cy="148.767" r="3.5" fill="none" stroke="#16F74F" class="ping"/><text x="227.573" y="152.767" font-size="11" text-anchor="start" fill="#8CE6A5">recon</text></g>
  <g style="animation-delay:0.56s" class="blip"><circle cx="212.247" cy="223.667" r="3.5" fill="#16F74F"/><circle cx="212.247" cy="223.667" r="3.5" fill="none" stroke="#16F74F" class="ping"/><text x="221.247" y="227.667" font-size="11" text-anchor="start" fill="#8CE6A5">web</text></g>
  <g style="animation-delay:1.48s" class="blip"><circle cx="88.301" cy="236.819" r="3.5" fill="#16F74F"/><circle cx="88.301" cy="236.819" r="3.5" fill="none" stroke="#16F74F" class="ping"/><text x="79.301" y="240.819" font-size="11" text-anchor="end" fill="#8CE6A5">binary</text></g>
  <g style="animation-delay:2.0s" class="blip"><circle cx="100.36" cy="160.098" r="3.5" fill="#16F74F"/><circle cx="100.36" cy="160.098" r="3.5" fill="none" stroke="#16F74F" class="ping"/><text x="91.36" y="164.098" font-size="11" text-anchor="end" fill="#8CE6A5">network</text></g>
  <g style="animation-delay:2.57s" class="blip"><circle cx="108.188" cy="95.979" r="3.5" fill="#16F74F"/><circle cx="108.188" cy="95.979" r="3.5" fill="none" stroke="#16F74F" class="ping"/><text x="99.188" y="99.979" font-size="11" text-anchor="end" fill="#8CE6A5">hardware</text></g>
